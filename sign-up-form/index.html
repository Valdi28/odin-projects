<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-up Form</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="wallpaper">
    <div class="brand-info">
      <img class="logo" src="img/odin.png" alt="Odin logo">
      <h1 class="name">ODIN</h1>
    </div>
    <p class="attribution">Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a
        href="https://unsplash.com">Unsplash</a></p>
  </div>
  <div class="main">

    <div class="content">
      <p class="initial-msg">
        <strong>
          This is not a real online service! You know you need something
          like this in your life to help you realize your deepest dreams. <br>
          Sign up <em>now</em> to get started
        </strong> <br> <br>
        <b>
          You <em>know</em> you want to.
        </b>
      </p>
      <form class="main-form">
        <section class="main-section">
          <h2 class="form-title">Let's do this!</h2>
          <div class="form-controls">
            <p>
              <label for="first-name">FIRST NAME</label>
              <input type="text" name="first-name" id="first-name" required>
            </p>
            <p>
              <label for="last-name">LAST NAME</label>
              <input type="text" name="last-name" id="last-name" required>
            </p>
            <p>
              <label for="email">EMAIL</label>
              <input type="email" name="email" id="email" required>
            </p>
            <p>
              <label for="phone-number">PHONE NUMBER</label>
              <input type="tel" name="phone-number" id="phone-number" required>
            </p>
            <p>
              <label for="password">PASSWORD</label>
              <input type="password" name="password" id="password" required>
            </p>
            <p>
              <label for="confirm-password">CONFIRM PASSWORD</label>
              <input type="password" name="confirm-password" id="confirm-password" required>
            </p>
          </div>
        </section>
        <button type="submit">Create Account</button>
      </form>
      <p class="alternative-auth">Already have an account? <a href="">Login</a></p>
    </div>
  </div>
</body>

</html>
