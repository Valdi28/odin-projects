<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>


<body>
  <div class="layout-container">
    <nav class="sidebar">
      <p class="dashboard-title">
        <img class="icon" src="img/sidebar/dashboard.svg" alt="Icon of a dashboard">
        <span>Dashboard</span>
      </p>
      
      <div class="navlinks">
        <p class="item">
          <img class="icon" src="img/sidebar/home.svg" alt="Home Icon">
          <span>Home</span>
        </p>

        <p class="item">
          <img class="icon" src="img/sidebar/identity.svg" alt="Identification icon">
          <span>Profile</span>
        </p>

        <p class="item">
          <img class="icon" src="img/sidebar/message.svg" alt="Message bubble Icon">
          <span>Messages</span>
        </p>

        <p class="item">
          <img class="icon" src="img/sidebar/clock.svg" alt="Clock icon">
          <span>History</span>
        </p>

        <p class="item">
          <img class="icon" src="img/sidebar/tasks.svg" alt="Tasks icon">
          <span>Tasks</span>
        </p>

        <p class="item">
          <img class="icon" src="img/sidebar/group.svg" alt="Group icon">
          <span>Community</span>
        </p>

        <p class="item">
          <img class="icon" src="img/sidebar/cog.svg" alt="Settings icon">
          <span>Settings</span>
        </p>

        <p class="item">
          <img class="icon" src="img/sidebar/help.svg" alt="Help icon">
          <span>Support</span>
        </p>

        <p class="item">
          <img class="icon" src="img/sidebar/shield-check.svg" alt="Privacy icon">
          <span>Privacy</span>
        </p>
      </div>
    </nav>

    <div class="header">
      <div class="topbar">
        <search class="search">
          <img class="icon" src="img/header/magnify.svg" alt="Magnify icon">
          <input type="search" name="search-input" id="search-input">
        </search>

        <img src="img/header/bell-ring.svg" alt="Notification's bell ring icon" class="notifications icon">

        <div class="user-info">
          <img src="img/fun-emoji/fun-emoji-1.svg" alt="User avatar" class="avatar">
          <p class="username">Morgan Oakley</p>
        </div>
      </div>

      <div class="managing-panel">

      </div>
    </div>

    <div class="main-content">
      <div class="projects">

      </div>

      <div class="announcements">

      </div>

      <div class="trending">

      </div>
    </div>
  </div>
</body>

</html>
