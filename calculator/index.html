<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Odin Calculator!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="error-msg"></div>
        <p class="display"></p>
        <div class="calc-buttons">
            <div class="numbers">
                <div class="row">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                </div>
                <div class="row">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                </div>
                <div class="row">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                </div>
                <div class="row">
                    <button class="dot">.</button>
                    <button class="zero">0</button>
                </div>
            </div>
            <div class="operators">
                <div class="row">
                    <button>AC</button>
                </div>
                <div class="row">
                    <button class="sum-btn">+</button>
                    <button class="substract-btn">-</button>
                </div>
                <div class="row">
                    <button class="multiply-btn">*</button>
                    <button class="divide-btn">/</button>
                </div>
                <div class="row">
                    <button class="solve-btn">=</button>
                </div>
                </div>
            </div>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
